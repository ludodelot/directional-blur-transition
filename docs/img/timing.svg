<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d"><title id="t">Whip timing</title><desc id="d">Position follows an expo ease; speed peaks at the cut; blur, chroma, bloom, exposure and grain follow speed.</desc><style>
:root{--fg:#1f2328;--mut:#59636e;--line:#c9d1d9;--fill:#f6f8fa;--a:#1f6feb;--b:#d1242f;--soft:#ddf4ff;--softb:#ffebe9}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--fill:#151b23;--a:#58a6ff;--b:#ff7b72;--soft:#0c2d6b;--softb:#5a1e24}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg);font-size:15px}
.mut{fill:var(--mut);font-size:13px}.t{font-size:18px;font-weight:600}.c{text-anchor:middle}
.box{fill:var(--fill);stroke:var(--line);stroke-width:1.5}
.A{fill:var(--soft);stroke:var(--a);stroke-width:2}.B{fill:var(--softb);stroke:var(--b);stroke-width:2}
.cam{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-dasharray:7 5}
.arr{stroke:var(--fg);stroke-width:2;fill:none}
.ax{stroke:var(--line);stroke-width:1.5;fill:none}
</style>
