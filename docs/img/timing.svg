<text x="0" y="0" class="t" style="font-size:16px">Scale with speed</text>
<text x="0" y="30">• blur length (sub-frame count)</text>
<text x="0" y="54">• chromatic split along the motion</text>
<text x="0" y="78">• highlight bloom</text>
