<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370" role="img" aria-labelledby="t d"><title id="t">Virtual camera on an A|B strip</title><desc id="d">Two frames are joined side by side and a camera window slides from A to B.</desc><style>
:root{--fg:#1f2328;--mut:#59636e;--line:#c9d1d9;--fill:#f6f8fa;--a:#1f6feb;--b:#d1242f;--soft:#ddf4ff;--softb:#ffebe9}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--fill:#151b23;--a:#58a6ff;--b:#ff7b72;--soft:#0c2d6b;--softb:#5a1e24}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg);font-size:15px}
.mut{fill:var(--mut);font-size:13px}.t{font-size:18px;font-weight:600}.c{text-anchor:middle}
.box{fill:var(--fill);stroke:var(--line);stroke-width:1.5}
.A{fill:var(--soft);stroke:var(--a);stroke-width:2}.B{fill:var(--softb);stroke:var(--b);stroke-width:2}
.cam{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-dasharray:7 5}
.arr{stroke:var(--fg);stroke-width:2;fill:none}
.ax{stroke:var(--line);stroke-width:1.5;fill:none}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor" style="fill:var(--fg)"/></marker></defs><text x="30" y="38" class="t">1 · A virtual camera slides over a strip [A | B]</text>
<rect x="60" y="80" width="360" height="200" rx="8" class="A"/><text x="240" y="190" class="c t">A</text>
<rect x="420" y="80" width="360" height="200" rx="8" class="B"/><text x="600" y="190" class="c t">B</text>
<rect x="60" y="80" width="360" height="200" rx="4" class="cam"/>
<text x="240" y="312" class="c mut">window at the start of the whip: you see A</text>
<rect x="420" y="80" width="360" height="200" rx="4" class="cam" opacity="0.45"/>
<path d="M240 66 H600" class="arr" marker-end="url(#h)" style="color:var(--fg)"/>
<text x="420" y="58" class="c mut">window travels one frame width on an expo ease</text>
<text x="600" y="312" class="c mut">…and ends on B, already in motion</text>
<text x="30" y="352" class="mut">No padding, no mirroring: B is physically next to A, so the join is just more image.</text>
</svg>